version: 2
updates:
  - package-ecosystem: npm
    directory: /Raycast
    schedule:
      interval: monthly
    groups:
      raycast-dependencies:
        patterns: ['*']
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
